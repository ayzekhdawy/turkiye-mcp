name: Build EXE Release

# Bir 'v*' tag'i push edildiğinde (örn. v1.5.0) otomatik olarak:
#   1. Windows'ta EXE derler
#   2. release_notes.md içeriğiyle GitHub Release oluşturur
#   3. TurkiyeMCP.exe'yi release asset'i olarak yükler
#
# Manuel tetikleme (workflow_dispatch) ile de çalıştırılabilir; bu durumda
# 'version' girilirse o tag oluşturulur, girilmezse pyproject.toml sürümü kullanılır.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm tag (örn. v1.5.0) — boş bırakılırsa pyproject.toml sürümü kullanılır'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview pystray Pillow keyring pymupdf magika

      - name: Sanity check (import app)
        run: python -c "import app, workspace; print('import OK, routes:', len(app.starlette_app.routes))"

      - name: Build EXE
        run: pyinstaller turkiye_mcp.spec --noconfirm --clean

      - name: Resolve version tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            PV=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            VERSION="v${PV}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Prepare release notes
        shell: bash
        run: |
          if [ ! -f release_notes.md ]; then
            echo "## Türkiye MCP ${{ steps.version.outputs.VERSION }}" > release_notes.md
            echo "" >> release_notes.md
            echo "Otomatik derlenmiş Windows EXE sürümü." >> release_notes.md
          fi

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Türkiye MCP ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: dist/TurkiyeMCP.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
