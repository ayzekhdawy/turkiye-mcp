name: Build EXE Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.1.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview pystray Pillow keyring pymupdf

      - name: Build EXE
        run: pyinstaller turkiye_mcp.spec --noconfirm

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); d=tomllib.load(f); print(d['project']['version'])")
            echo "VERSION=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        id: notes
        shell: bash
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from app import MODULES_AVAILABLE
              active = sum(1 for v in MODULES_AVAILABLE.values() if v)
              total = len(MODULES_AVAILABLE)
              notes = f'''## Turkiye MCP Server \${{ steps.version.outputs.VERSION }}

          ### Moduller ({active}/{total} aktif)
          '''
              for name, ok in MODULES_AVAILABLE.items():
                  notes += f'- {'✅' if ok else '❌'} {name}\n'
              notes += '''
          ### Indirme
          - **TurkiyeMCP.exe** — Windows 10/11 (64-bit)
          - Ikili tikla ve calistir, ek kurulum gerekmez.

          ### Kullanim
          1. TurkiyeMCP.exe dosyasini indirin
          2. Ikili tikla ile calistirin
          3. Sistem tepsisinde Turkiye bayragi ikonu gorunur
          4. Dashboard otomatik olarak acilir

          ### Komut Satiri Secenekleri
          - \`TurkiyeMCP.exe\` — GUI ile baslat
          - \`TurkiyeMCP.exe --no-gui\` — Sadece sunucu
          - \`TurkiyeMCP.exe --browser\` — Tarayicida ac
          - \`TurkiyeMCP.exe --port 9090\` — Farkli port
          - \`TurkiyeMCP.exe --no-tray\` — Sistem tepsisi ikonu yok
          '''
              with open('release_notes.md', 'w', encoding='utf-8') as f:
                  f.write(notes)
          except Exception as e:
              with open('release_notes.md', 'w') as f:
                  f.write(f'Turkiye MCP Server ${{ steps.version.outputs.VERSION }}')
          "

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Türkiye MCP Server ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            dist/TurkiyeMCP.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}